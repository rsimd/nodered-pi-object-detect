<script type="text/html" data-template-name="pi-object-detector">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> ノード名</label>
    <input type="text" id="node-input-name" placeholder="カメラ物体検知">
  </div>
  <div class="form-row">
    <label for="node-input-projectRoot"><i class="fa fa-folder-open"></i> プロジェクトルート</label>
    <input type="text" id="node-input-projectRoot" placeholder="空欄なら標準パスを使用">
  </div>
  <div class="form-row">
    <label for="node-input-configPath"><i class="fa fa-cog"></i> 検知設定ファイル</label>
    <input type="text" id="node-input-configPath" placeholder="config/detector.json">
  </div>
  <div class="form-row">
    <label for="node-input-pythonPath"><i class="fa fa-code"></i> Python実行ファイル</label>
    <input type="text" id="node-input-pythonPath" placeholder="空欄ならプロジェクトの仮想環境を使用">
  </div>
  <div class="form-row">
    <label for="node-input-autoStart"><i class="fa fa-play"></i> 起動設定</label>
    <input type="checkbox" id="node-input-autoStart" style="width:auto; margin-left:8px;">
    <span style="margin-left:6px;">フロー開始時に自動起動</span>
  </div>
  <div class="form-row">
    <label for="node-input-autoRestart"><i class="fa fa-refresh"></i> 再起動設定</label>
    <input type="checkbox" id="node-input-autoRestart" style="width:auto; margin-left:8px;">
    <span style="margin-left:6px;">異常終了時に自動再起動</span>
  </div>
</script>

<script type="text/html" data-help-name="pi-object-detector">
  <p>カメラノードから受け取ったJPEGフレームをPythonワーカーで物体検知します。</p>
  <h3>出力</h3>
  <ol>
    <li><b>状態</b>：カメラ、FPS、推論時間などの稼働状態</li>
    <li><b>新規物体</b>：新しく登場した物体のラベル、信頼度、画像情報</li>
    <li><b>エラー</b>：ワーカー起動失敗、終了、カメラ・モデルエラー</li>
  </ol>
  <p>同じ物体が画面に留まっている間はイベントを重複保存しません。入力は <code>msg.payload</code> のJPEG Bufferです。</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("pi-object-detector", {
    category: "カメラ・物体検知",
    color: "#c7e9c0",
    defaults: {
      name: { value: "" },
      projectRoot: { value: "" },
      configPath: { value: "config/detector.json", required: true },
      pythonPath: { value: "" },
      autoStart: { value: true },
      autoRestart: { value: true }
    },
    inputs: 1,
    outputs: 3,
    outputLabels: ["状態", "新規物体", "エラー"],
    icon: "font-awesome/fa-camera",
    paletteLabel: "物体検知カメラ",
    label: function () {
      return this.name || "物体検知カメラ";
    }
  });
</script>
