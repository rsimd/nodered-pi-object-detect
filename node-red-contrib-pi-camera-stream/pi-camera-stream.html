<script type="text/html" data-template-name="pi-camera-stream">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> ノード名</label>
    <input type="text" id="node-input-name" placeholder="USBカメラ映像">
  </div>
  <div class="form-row">
    <label for="node-input-projectRoot"><i class="fa fa-folder-open"></i> プロジェクトルート</label>
    <input type="text" id="node-input-projectRoot" placeholder="空欄なら標準パスを使用">
  </div>
  <div class="form-row">
    <label for="node-input-configPath"><i class="fa fa-cog"></i> カメラ設定ファイル</label>
    <input type="text" id="node-input-configPath" placeholder="config/detector.json">
  </div>
  <div class="form-row">
    <label for="node-input-pythonPath"><i class="fa fa-code"></i> Python実行ファイル</label>
    <input type="text" id="node-input-pythonPath" placeholder="空欄ならプロジェクトの仮想環境を使用">
  </div>
  <div class="form-row">
    <label for="node-input-autoStart"><i class="fa fa-play"></i> 起動設定</label>
    <input type="checkbox" id="node-input-autoStart" style="width:auto; margin-left:8px;">
    <span style="margin-left:6px;">フロー開始時に自動起動</span>
  </div>
  <div class="form-row">
    <label for="node-input-autoRestart"><i class="fa fa-refresh"></i> 再起動設定</label>
    <input type="checkbox" id="node-input-autoRestart" style="width:auto; margin-left:8px;">
    <span style="margin-left:6px;">異常終了時に自動再起動</span>
  </div>
</script>

<script type="text/html" data-help-name="pi-camera-stream">
  <p>USBカメラから連続してJPEGフレームを取得し、Node-REDのメッセージとして出力します。</p>
  <h3>出力</h3>
  <ol>
    <li><b>映像フレーム</b>：<code>msg.payload</code> がJPEG形式のBuffer</li>
    <li><b>カメラ状態</b>：カメラ、FPS、エラーなどの稼働状態</li>
  </ol>
  <p>設定は <code>config/detector.json</code> の <code>camera</code> セクションで行います。</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("pi-camera-stream", {
    category: "カメラ・物体検知",
    color: "#a6d8f0",
    defaults: {
      name: { value: "" },
      projectRoot: { value: "" },
      configPath: { value: "config/detector.json", required: true },
      pythonPath: { value: "" },
      autoStart: { value: true },
      autoRestart: { value: true }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["映像フレーム", "カメラ状態"],
    icon: "font-awesome/fa-video-camera",
    paletteLabel: "USBカメラ映像",
    label: function () {
      return this.name || "USBカメラ映像";
    }
  });
</script>
